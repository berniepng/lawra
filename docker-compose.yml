services:

  # ── Vector store ─────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lawra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # ── n8n database ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lawra-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lawra}
      POSTGRES_USER:     ${POSTGRES_USER:-lawra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawra} -d ${POSTGRES_DB:-lawra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Workflow engine ───────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: lawra-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST:             ${N8N_HOST:-localhost}
      N8N_PORT:             5678
      N8N_PROTOCOL:         ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE:    false
      N8N_ENCRYPTION_KEY:   ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set in .env}
      WEBHOOK_URL:          ${WEBHOOK_URL:-http://localhost:5678/}
      DB_TYPE:                    postgresdb
      DB_POSTGRESDB_HOST:         postgres
      DB_POSTGRESDB_PORT:         5432
      DB_POSTGRESDB_DATABASE:     ${POSTGRES_DB:-lawra}
      DB_POSTGRESDB_USER:         ${POSTGRES_USER:-lawra}
      DB_POSTGRESDB_PASSWORD:     ${POSTGRES_PASSWORD}
      OLLAMA_HOST:          http://host.docker.internal:11434
      QDRANT_URL:           http://qdrant:6333
      N8N_DIAGNOSTICS_ENABLED:             false
      N8N_VERSION_NOTIFICATIONS_ENABLED:   false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ── Named volumes ─────────────────────────────────────────────────────────
volumes:
  qdrant_storage:
  postgres_data:
  n8n_data:
